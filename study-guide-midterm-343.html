<style>
/* Layout idea: a single narrow study column; hash tables drawn as real slot rows, graphs as adjacency lists. */
:root {
  --bg: #f3f5f8;
  --panel: #ffffff;
  --ink: #18202c;
  --muted: #5b6676;
  --line: #d9dfe8;
  --accent: #2346c8;
  --accent-soft: #e6ebfb;
  --probe: #b86a00;
  --probe-soft: #fbf0de;
  --good: #1d7a46;
  --good-soft: #e2f3e8;
  --bad: #b3261e;
  --bad-soft: #fbe5e3;
  --display: "IBM Plex Sans Condensed", "Arial Narrow", system-ui, sans-serif;
  --body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #11151c; --panel: #1a2029; --ink: #e6ebf2; --muted: #9aa5b5; --line: #2c3542;
    --accent: #8aa4ff; --accent-soft: #232d4a; --probe: #f0a845; --probe-soft: #3a2c15;
    --good: #5fcf8c; --good-soft: #17301f; --bad: #ff8a80; --bad-soft: #3a1c1a;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #11151c; --panel: #1a2029; --ink: #e6ebf2; --muted: #9aa5b5; --line: #2c3542;
  --accent: #8aa4ff; --accent-soft: #232d4a; --probe: #f0a845; --probe-soft: #3a2c15;
  --good: #5fcf8c; --good-soft: #17301f; --bad: #ff8a80; --bad-soft: #3a1c1a;

}

<script>
// ---------- helpers ----------
function slots(str, opts) {
  opts = opts || {};
  const cells = str.trim().split(/\s+/);
  const hit = opts.hit || [];
  let a = '<div class="slotwrap"><div class="slots" role="img" aria-label="table ' + str + '"><div class="slotrow">';
  cells.forEach((c, i) => {
    const cls = c === '_' ? 'slot' : (hit.includes(i) ? 'slot hit' : 'slot full');
    a += '<div class="' + cls + '">' + (c === '_' ? '' : c) + '</div>';
  });
  a += '</div><div class="slotrow">';
  cells.forEach((c, i) => { a += '<div class="idx">' + i + '</div>'; });
  return a + '</div></div></div>';
}
function esc(s) { return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }

// ---------- content ----------
let TOPICS = [
{
  id: 'l01', title: 'L01 Recursion, counting, C++ memory', sub: 'loops, recurrences, Rule of Three, passing',
  cram: `<ul>
<li>Dependent loop <code>j = i+1..n</code>: n(n−1)/2. Halving loop from n: ⌊log₂ n⌋ + 1 passes (16 → 5).</li>
<li>Recurrences: length T = 1 + T(n−1) → n + 1. Binary search 1 + T(n/2) → ⌊log₂ n⌋ + 1. Hanoi 1 + 2T(n−1) → 2ⁿ − 1.</li>
<li>k-sum checks = C(n, k). 3-sum: n(n−1)(n−2)/6.</li>
<li>Print before and after the recursive call: downUp(3) → 3 2 1 1 2 3.</li>
<li>Default copy is shallow: two objects share nodes → double delete. Rule of Three: destructor, copy ctor, operator= (self-check, free, deep copy, return *this).</li>
<li>by value = copy; <code>int&amp;</code> and <code>int*</code> change the caller; <code>const T&amp;</code> = no copy, read-only.</li>
</ul>`,
  lesson: `
<h3>Counting loops</h3>
<ul>
<li>Pick one basic operation and count exactly how often it runs, as a function of n.</li>
<li>Nested n × n: n². Dependent <code>for j = i+1; j &lt; n</code>: (n−1) + … + 1 = <b>n(n−1)/2</b> (n = 5 → 10, n = 1000 → 499,500).</li>
<li>Halving <code>for (i = n; i &gt;= 1; i /= 2)</code>: <b>⌊log₂ n⌋ + 1</b> passes (16 → 5, 1000 → 10, 10⁶ → 20).</li>
<li>Sequence adds (n + n²). Nesting multiplies (n · log n).</li>
</ul>
<h3>Recurrences, by unrolling</h3>
<div class="tbl"><table>
<tr><th>Function</th><th>T(n)</th><th>Solution</th></tr>
<tr><td>list length (calls)</td><td>T(0) = 1, T(n) = 1 + T(n−1)</td><td>n + 1</td></tr>
<tr><td>binary search (probes)</td><td>1 + T(n/2)</td><td>⌊log₂ n⌋ + 1</td></tr>
<tr><td>Towers of Hanoi (moves)</td><td>T(0) = 0, 1 + 2T(n−1)</td><td>2ⁿ − 1 (10 → 1023)</td></tr>
</table></div>
<ul>
<li>k-sum by recursion: checks L(m, k) = L(m−1, k−1) + L(m−1, k) = Pascal's rule, so <b>C(n, k)</b>. 3-sum on n = 10 → 120 checks.</li>
<li>Naive Fibonacci recomputes: fib(10) makes 177 calls.</li>
<li>Binary search worst case: 15 keys → 4 probes, 16 → 5, 1000 → 10.</li>
</ul>
<h3>Recursion basics</h3>
<ul>
<li>Base case + recursive case on a smaller input. Each call has its own stack frame.</li>
<li>Code before the call runs on the way down, code after runs on the way back up: <code>downUp(3)</code> prints <b>3 2 1 1 2 3</b>.</li>
<li>Failure modes: no base case, argument doesn't shrink, recomputation, too deep a stack.</li>
<li>Tree height in L01 code counts nodes (empty = 0). The textbook counts links (empty = −1, one node = 0).</li>
</ul>
<h3>Owning memory</h3>
<ul>
<li>Returning the address of a local is a dangling pointer. <code>new</code> lives until <code>delete</code>.</li>
<li>Destructor: read <code>head-&gt;next</code> before deleting <code>head</code>.</li>
<li>No copy constructor → <code>b = a</code> copies the head pointer. <code>b.setFirst(99)</code> changes a too, and both destructors free the same nodes: <b>double delete</b>.</li>
<li><b>Rule of Three:</b> if a class needs a destructor, it needs a copy constructor and copy assignment too.</li>
<li>operator=: <code>if (this != &amp;other) { clear(); copyFrom(other); } return *this;</code>. Without the check, <code>c = c</code> copies from freed memory.</li>
<li>Valgrind clean report: "All heap blocks were freed", "0 errors".</li>
</ul>
<h3>Passing arguments</h3>
<pre>byValue(a); byRef(b); byPtr(&amp;c);   // each sets its parameter to 99
cout &lt;&lt; a &lt;&lt; b &lt;&lt; c;                // 1 99 99</pre>
<p>Pass big objects by <code>const T&amp;</code>: zero copies instead of N.</p>`,
  qs: [
    { c: 1, q: 'How many times does ops++ run when n = 6?\nfor (i = 0; i < n; i++)\n  for (j = i + 1; j < n; j++) ops++;',
      o: ['15', '36', '21', '6'], a: 0, e: 'The inner loop runs 5, 4, 3, 2, 1, 0 times: n(n − 1)/2 = 6·5/2 = 15.' },
    { c: 1, q: 'How many times does the body run for n = 100?\nfor (i = n; i >= 1; i /= 2) ops++;',
      o: ['7', '6', '50', '100'], a: 0, e: 'i = 100, 50, 25, 12, 6, 3, 1: seven values. ⌊log₂ 100⌋ + 1 = 6 + 1 = 7.' },
    { c: 1, q: 'Towers of Hanoi satisfies T(0) = 0, T(n) = 1 + 2T(n − 1). How many moves for n = 6?',
      o: ['63', '64', '12', '32'], a: 0, e: 'Unrolling gives 1 + 2 + 4 + … + 2ⁿ⁻¹ = 2ⁿ − 1 = 63.' },
    { q: 'void downUp(int n) { if (n == 0) return; cout << n; downUp(n − 1); cout << n; }\nWhat does downUp(3) print?',
      o: ['3 2 1 1 2 3', '3 2 1', '1 2 3 3 2 1', '3 2 1 3 2 1'], a: 0, e: 'The first print runs on the way down (3 2 1), the second on the way back up (1 2 3).' },
    { c: 1, q: 'ShallowList has a destructor but no copy constructor. a holds 3 → 5 → 8. After ShallowList b = a; b.setFirst(99); what does a.print() show, and what happens at scope end?',
      o: ['99 → 5 → 8, then a double delete', '3 → 5 → 8, then a clean exit', '99 → 5 → 8, then a clean exit', 'Compile error'], a: 0,
      e: 'The default copy duplicates the head pointer, so a and b share one chain. Both destructors free the same three nodes.' },
    { q: 'void byValue(int x){x = 99;} void byRef(int& x){x = 99;} void byPtr(int* x){*x = 99;}\nWith a = b = c = 1: byValue(a); byRef(b); byPtr(&c); What prints for a b c?',
      o: ['1 99 99', '99 99 99', '1 1 99', '1 99 1'], a: 0, e: 'byValue changes its own copy. A reference and a pointer both reach the caller\'s variable.' },
    { q: 'The recursive k-sum counter makes L(m, k) = L(m − 1, k − 1) + L(m − 1, k) checks. How many checks for 3-sum on n = 10?',
      o: ['120', '1000', '720', '30'], a: 0, e: 'Pascal\'s rule makes L(n, k) = C(n, k). C(10, 3) = 10·9·8/6 = 120, the same as the triple loop.' },
    { q: 'Worst-case probes for binary search on a sorted array of 1000 keys?',
      o: ['10', '9', '500', '11'], a: 0, e: '⌊log₂ 1000⌋ + 1 = 9 + 1 = 10.' },
    { q: 'Why must operator= check if (this != &other) before freeing?',
      o: ['So c = c doesn\'t free the list it is about to copy', 'To avoid a compile error', 'So the destructor isn\'t called', 'To make the copy shallow'], a: 0,
      e: 'Self-assignment would clear the object, then deep-copy from the nodes it just deleted.' }
  ]
},
{
  id: 'l02', title: 'L02 Time analysis', sub: 'doubling, tilde, cost models, the 3-sum ladder',
  cram: `<ul>
<li>Doubling ratio r = T(2N)/T(N) → exponent b = log₂ r. Ratio 4 → N², 8 → N³.</li>
<li>Find a from one point: a = T(N)/N^b, then predict.</li>
<li>Tilde keeps the leading term with its constant: N(N−1)(N−2)/6 ~ N³/6. Order of growth drops the constant too.</li>
<li>Sum rule: sequential steps add, biggest wins. Product rule: nested work multiplies.</li>
<li>Outer i doubles, inner runs i times → 1 + 2 + … ≈ N (linear, not N log N).</li>
<li>3-sum ladder: brute N³ → sort + binary search N² log N → sort + two pointers N².</li>
</ul>`,
  lesson: `
<h3>Doubling experiment</h3>
<ul>
<li>If T(N) = aN^b, then T(2N)/T(N) = 2^b. The constant a cancels, so <b>b = log₂(ratio)</b>.</li>
<li>Ratio ×2 linear, ×4 quadratic, ×8 cubic. Log-log plot: a straight line with slope b.</li>
<li>Get a from one row: a = T(N)/N^b. Example: T(2000) = 1.05 s, b = 3 → a = 1.31 × 10⁻¹⁰, T(4000) ≈ 8.4 s.</li>
<li>Different machine or language changes a, never b.</li>
<li>Time ratios wobble (small N, warm-up, caches). Count ratios are exact.</li>
</ul>
<h3>Model: count from the code</h3>
<ul>
<li>Total time = Σ cost × frequency. Frequency belongs to the algorithm.</li>
<li>3-sum inner <code>if</code>: C(N, 3) = N³/6 − N²/2 + N/3 = 166,167,000 at N = 1000.</li>
<li><b>Tilde:</b> f ~ g when f/g → 1. Keeps the constant: ~N³/6. <b>Order of growth</b> drops it: N³.</li>
</ul>
<div class="tbl"><table>
<tr><th>Sum</th><th>Exact</th><th>Tilde</th></tr>
<tr><td>1 + 2 + … + N</td><td>N(N+1)/2</td><td>~N²/2</td></tr>
<tr><td>pairs i &lt; j</td><td>N(N−1)/2</td><td>~N²/2</td></tr>
<tr><td>1² + … + N²</td><td>N(N+1)(2N+1)/6</td><td>~N³/3</td></tr>
<tr><td>triples</td><td>N(N−1)(N−2)/6</td><td>~N³/6</td></tr>
<tr><td>1 + 2 + 4 + … + N</td><td>2N − 1</td><td>~2N</td></tr>
</table></div>
<h3>Loop shapes</h3>
<ul>
<li><code>for i &lt; N; for j = 1; j &lt; N; j *= 2</code>: N log₂ N.</li>
<li><code>for i = 1; i &lt; N; i *= 2; for j &lt; i</code>: 1 + 2 + … + N/2 = N − 1 → <b>linear</b> (a sum, not a product).</li>
<li><code>for i = N; i &gt; 0; i /= 2; for j &lt; i</code>: N + N/2 + … ~ 2N → linear.</li>
<li><code>for i; for j = i..N; for k &lt; 3</code>: 3N(N+1)/2 ~ 3N²/2.</li>
<li><code>for (i = 0; i*i &lt; N; i++)</code>: √N.</li>
</ul>
<h3>Cost models</h3>
<p>RAM (every primitive op = 1), inner-loop executions, array accesses (3-sum ~N³/2), compares, probes (binary search), vertices + edges (graph search).</p>
<h3>The 3-sum ladder</h3>
<div class="tbl"><table>
<tr><th>Algorithm</th><th>Idea</th><th>Order</th><th>Doubling ratio</th></tr>
<tr><td>brute force</td><td>every triple</td><td>N³</td><td>8</td></tr>
<tr><td>sort + binary search</td><td>search −(a[i] + a[j]) for each pair</td><td>N² log N</td><td>just over 4</td></tr>
<tr><td>sort + two pointers</td><td>lo++ when s &lt; 0, hi−− when s &gt; 0</td><td>N²</td><td>4</td></tr>
</table></div>
<ul>
<li>2-sum: brute N², sort + binary search N log N.</li>
<li><b>Sum rule:</b> N log N + N² → N². <b>Product rule:</b> N iterations × log N each → N log N.</li>
<li>Lower bound for 3-sum is only Ω(N) (must read input); N² is the best known.</li>
</ul>
<h3>Growth classes</h3>
<p>1 &lt; log N &lt; N &lt; N log N &lt; N² &lt; N³ &lt; 2ᴺ. At 10⁶ items and 10⁹ ops/s: N log N ≈ 20 ms, N² ≈ 17 min, N³ ≈ 31 years. A 2× machine grows feasible N by 2^(1/b): ×2 for N, ×1.41 for N², ×1.26 for N³, +1 for 2ᴺ.</p>`,
  qs: [
    { c: 1, q: 'Running times: N = 1000 → 0.21 s, 2000 → 0.83 s, 4000 → 3.32 s. Estimate T(8000).',
      o: ['About 13.3 s', 'About 6.6 s', 'About 26.6 s', 'About 4.2 s'], a: 0, e: 'Ratios ≈ 4, so b = 2. Each doubling multiplies time by 4: 3.32 × 4 ≈ 13.3 s.' },
    { c: 1, q: 'A program\'s running time grows by a factor of 8 each time N doubles. Its order of growth is…',
      o: ['N³', 'N⁸', '2ᴺ', 'N log N'], a: 0, e: 'Ratio = 2^b, so b = log₂ 8 = 3.' },

  cram: `<ul>
<li>O(g): f ≤ c·g for n ≥ n₀ (upper). Ω: f ≥ c·g (lower). Θ = O ∩ Ω (tight).</li>
<li>Witnesses: 2n² + 8n + 5 ≤ 15n² from n₀ = 1; any c &gt; 2 works with a later n₀; c = 2 never works.</li>
<li>Limit f/g → 0: f ∈ O(g) not Ω; → constant: Θ; → ∞: Ω not O. Log base doesn't matter.</li>
<li>Case (best/worst/average/amortized) and bound (O/Ω/Θ) are separate choices. Insertion sort: best n − 1, worst n(n−1)/2 compares.</li>
<li>Algorithm = upper bound on a problem; a lower bound belongs to the problem (search: ⌈log₂(N+1)⌉).</li>
<li>sizeof: char 1, int 4, pointer/long/double 8. {int; Node*} = 16. {char; int; char} = 12, {int; char; char} = 8. vector header 24.</li>

  lesson: `
<h3>Definitions (sets of functions)</h3>
<ul>
<li><b>O(g)</b>: ∃ c, n₀ &gt; 0 with 0 ≤ f(n) ≤ c·g(n) for all n ≥ n₀. Upper bound.</li>
<li><b>Ω(g)</b>: c·g(n) ≤ f(n) for n ≥ n₀. Lower bound.</li>
<li><b>Θ(g)</b>: c₁g ≤ f ≤ c₂g. Tight. Theorem: Θ = O ∩ Ω.</li>
<li>O is not "the running time": 5n ∈ O(n³) is true. "At least n" is Ω(n), not O.</li>
</ul>
<h3>Witnesses</h3>
<div class="tbl"><table>
<tr><th>c for 2n² + 8n + 5 ≤ c·n²</th><th>smallest n₀</th></tr>
<tr><td>15 (term by term)</td><td>1</td></tr>
<tr><td>3</td><td>9</td></tr>
<tr><td>2.5</td><td>17</td></tr>
<tr><td>2</td><td>none: 8n + 5 ≤ 0 never holds</td></tr>
</table></div>
<ul>
<li>Non-membership: assume witnesses, derive n ≤ constant for all n: contradiction. 6n³ ∉ O(n²).</li>
<li>Polynomial with leading coefficient a_k &gt; 0 is Θ(n^k).</li>
<li>Constants that depend on n prove nothing. Checking a few values proves nothing.</li>
<li>Tilde is stronger than Θ: 2N³ ∈ Θ(N³) but 2N³ ≁ N³.</li>
</ul>
<h3>Limit test and hierarchy</h3>
<ul>
<li>lim f/g = 0 → g wins (g grows strictly quicker). = L &gt; 0 → Θ. = ∞ → f wins.</li>
<li>1 ≺ log n ≺ √n ≺ n ≺ n log n ≺ n² ≺ n³ ≺ 2ⁿ ≺ n!.</li>
<li>log₂(n!) ∈ Θ(n log n). 2^(log₂ n) = n. log(n²) = 2 log n ∈ O(log n). 2^(2n) ∉ O(2ⁿ).</li>
<li>Log bases differ by a constant: O(log₂ n) = O(ln n).</li>
</ul>
<h3>Cases vs bounds</h3>
<div class="tbl"><table>
<tr><th>Insertion sort (compares)</th><th>Count</th><th>Set</th></tr>
<tr><td>best: sorted</td><td>n − 1</td><td>Θ(n)</td></tr>
<tr><td>worst: reversed</td><td>n(n − 1)/2</td><td>Θ(n²)</td></tr>
<tr><td>average: random</td><td>≈ n²/4</td><td>Θ(n²)</td></tr>
</table></div>
<ul>
<li><b>Amortized:</b> total over any sequence ÷ n, with no probability. push_back: one call can be Θ(N), amortized Θ(1). Capacities 1, 2, 4, …, 1024; regrowth copies 1023 for N = 1000.</li>
<li>An algorithm's bound is an <b>upper bound on the problem</b>. A lower bound must hold for every algorithm. Comparison sorting Ω(N log N) is settled; 3-sum O(N²) vs Ω(N) is open.</li>
<li>Comparison search lower bound: decision tree with N + 1 leaves → height ≥ ⌈log₂(N + 1)⌉.</li>
</ul>
<h3>Memory</h3>
<ul>
<li>char 1, bool 1, int 4, long 8, double 8, pointer 8.</li>
<li>Alignment: <code>struct {int data; Node* next;}</code> = <b>16</b> (4 bytes padding). <code>{char; int; char}</code> = 12, <code>{int; char; char}</code> = 8. Order fields largest first.</li>
<li>Array of N ints: 4N bytes. Linked list: 16N. Same order, 4× constant.</li>
<li><code>sizeof(vector&lt;int&gt;)</code> = 24 (pointer, size, capacity); sizeof never counts the heap block.</li>
<li>Auxiliary space = beyond the input. Recursion costs one frame per live call: fact(n) Θ(n), binary search Θ(log N), mergesort Θ(N) buffer + Θ(log N) stack.</li>
</ul>
<h3>Machine models</h3>
<p>If every operation costs between two constants independent of N, the order of growth doesn't change: swapping and thrashing are huge constants, not new exponents. The exponent changes only when one access costs more as N grows (physical distance, hierarchical memory).</p>`,

{
  id: 'l04', title: 'L04 Trees and BSTs', sub: 'shapes, traversals, search/insert, ordered ops, Hibbard',
  cram: `<ul>
<li>Depth: links from root (root 0). Height: max depth. n nodes: height ⌊log₂ n⌋ to n − 1.</li>
<li>Full = 0 or 2 children. Perfect = full + leaves level. Complete = levels full except last, packed left.</li>
<li>Pre: node L R. In: L node R (sorted for a BST). Post: L R node. Level: queue.</li>
<li>Insert grows at a null link; shape depends on insertion order. Sorted input → a path.</li>
<li>floor = largest ≤ k, ceiling = smallest ≥ k, rank(k) = # keys &lt; k, select(i) = key of rank i.</li>
<li>Hibbard delete, two children: copy the in-order successor (min of right subtree) up, deleteMin from the right subtree.</li>
</ul>`,
  lesson: `
<h3>Vocabulary and shapes</h3>
<ul>
<li>Root, parent, child, leaf, internal node, subtree. Depth of a node = links from the root (root = 0). Height = maximum depth.</li>
<li><b>Full:</b> every node has 0 or 2 children. <b>Perfect:</b> full and all leaves on one level. <b>Complete:</b> all levels full except possibly the last, packed left. <b>Balanced:</b> subtree heights differ by ≤ 1 everywhere.</li>
<li>Every complete tree is balanced, not the other way around.</li>
<li>Height of n nodes: minimum ⌊log₂ n⌋, maximum n − 1 (a path).</li>
</ul>
<h3>Traversals</h3>
<p>Running example: insert 50, 30, 70, 20, 40, 60, 80, 45.</p>
<pre>        50
      /    \\
    30      70
   /  \\    /  \\
  20  40  60  80
        \\
        45</pre>
<div class="tbl"><table>
<tr><th>Order</th><th>Rule</th><th>Result</th></tr>
<tr><td>pre</td><td>node, L, R</td><td>50 30 20 40 45 70 60 80</td></tr>
<tr><td>in</td><td>L, node, R</td><td>20 30 40 45 50 60 70 80 (sorted)</td></tr>
<tr><td>post</td><td>L, R, node</td><td>20 45 40 30 60 80 70 50</td></tr>
<tr><td>level</td><td>queue, top to bottom</td><td>50 30 70 20 40 60 80 45</td></tr>
</table></div>
<ul>
<li>Expression trees: operators internal, operands leaves. Evaluation is post-order (children first). (2 + 3) × (4 − 1) = 15.</li>
</ul>
<h3>Search and insert</h3>
<ul>
<li>Invariant at <b>every</b> node: left subtree keys &lt; node &lt; right subtree keys.</li>
<li>Search: compare and go left or right; hit, or miss at a null link.</li>
<li>Insert: search, then hang a new node at the null link; recompute <code>size</code> on the way back up. Equal key updates the value.</li>
</ul>
<h3>Ordered operations (all Θ(height))</h3>
<ul>
<li>min/max: follow left/right links to the end.</li>
<li>floor(k) = largest key ≤ k. ceiling(k) = smallest ≥ k. In the example: floor(55) = 50, ceiling(55) = 60.</li>
<li>rank(k) = number of keys &lt; k: rank(45) = 3. select(i) = key of rank i (0-based): select(4) = 50.</li>
<li>Range keys(lo, hi): pruned in-order, cost height + output.</li>
</ul>
<h3>Deletion</h3>
<ul>
<li>0 or 1 child: splice it out.</li>
<li>2 children (<b>Hibbard</b>): copy the <b>in-order successor</b> (min of the right subtree, which has no left child) into the node, then deleteMin on the right subtree.</li>
<li>Delete 50 above → successor 60 moves up: preorder 60 30 20 40 45 70 80.</li>
<li>Delete 30 → successor 40 moves up: preorder 50 40 20 45 70 60 80.</li>
<li>Always using the successor skews the tree (≈ √n average path length over many updates).</li>
</ul>
<h3>Analysis</h3>
<ul>
<li>Random insert order: average depth ~1.39 log₂ N, average height ~2.99 log₂ N.</li>
<li>Sorted input: a path, Θ(n) per op. That is why balanced trees exist.</li>
<li>Sorted array: search Θ(log n) but insert Θ(n) (shifting). BST: insert Θ(log n) on average.</li>
</ul>`,

{
  id: 'l05', title: 'L05 AVL trees', sub: 'balance factor, rotations, four cases, height bound',
  cram: `<ul>
<li>bf = height(left) − height(right), must stay in {−1, 0, +1}. height(null) = −1, leaf = 0.</li>
<li>LL → rotate right. RR → rotate left. LR → left on child, then right. RL → right on child, then left.</li>
<li>Rotations keep in-order; only the middle subtree changes parent.</li>
<li>Insert: at most one (single or double) rotation. Delete: may rotate at every level, O(log n).</li>
<li>Min nodes N(h) = 1 + N(h−1) + N(h−2): 1, 2, 4, 7, 12, 20, 33. Height ≤ 1.44 log₂ n (10⁹ keys → 43).</li>
<li>Sorted 1..7 → root 4, height 2. 30,10,20 → LR, root 20.</li>
</ul>`,
  lesson: `
<h3>The invariant</h3>
<ul>
<li>AVL = Adelson-Velsky and Landis (1962), the first self-balancing BST.</li>
<li><b>bf(x) = height(left) − height(right)</b> ∈ {−1, 0, +1} at every node. height(null) = −1, leaf = 0.</li>
<li>Only nodes on the insert/delete path can reach ±2; fix them on the way back up.</li>
</ul>
<h3>Rotations</h3>
<pre>rotateRight(y):       y            x
                     / \\          / \\
                    x   C   →    A   y
                   / \\              / \\
                  A   B            B   C
x = y-&gt;left; y-&gt;left = x-&gt;right; x-&gt;right = y; fix(y); fix(x);</pre>
<ul>
<li>In-order stays A x B y C. Only B (keys between x and y) changes parent. O(1).</li>
</ul>
<h3>Four cases (two steps down the tall side)</h3>
<div class="tbl"><table>
<tr><th>Case</th><th>Steps</th><th>Fix</th></tr>
<tr><td>LL</td><td>left, left</td><td>rotate right</td></tr>
<tr><td>RR</td><td>right, right</td><td>rotate left</td></tr>
<tr><td>LR</td><td>left, right</td><td>rotate left on child, then right</td></tr>
<tr><td>RL</td><td>right, left</td><td>rotate right on child, then left</td></tr>
</table></div>
<p>In code: bf(t) &gt; 1 and bf(t-&gt;left) &lt; 0 → LR. bf(t) &lt; −1 and bf(t-&gt;right) &gt; 0 → RL.</p>
<h3>Worked inserts</h3>
<ul>
<li>30, 10, 20 → LR at 30 → root 20.</li>
<li>1..7 sorted → 4(2(1, 3), 6(5, 7)), height 2, 4 rotations.</li>
<li>50, 30, 70, 20, 40, 35 → 50 at +2, 35 in 30's right → LR → root 40: preorder 40 30 20 35 50 70.</li>
<li>10, 20, 30, 40, 50, then 25 → root 20 at −2, right child 40 at +1 → RL → root 30: preorder 30 20 10 25 40 50.</li>
</ul>
<h3>Insert vs delete</h3>
<ul>
<li>Insert: the first unbalanced node gets <b>one</b> rotation (single or double), and that restores the old subtree height, so the whole tree is fixed.</li>
<li>Delete: BST delete (successor), then rebalance up. A rotation can shorten the parent, so rotations may be needed at <b>every</b> level: O(log n).</li>
<li>Delete 1 from 3(1, 4(−, 5)): bf(3) = −2, RR → rotate left → 4(3, 5).</li>
</ul>
<h3>Height bound</h3>
<ul>
<li>Fewest nodes at height h: <b>N(h) = 1 + N(h−1) + N(h−2)</b>, N(0) = 1, N(1) = 2 → 1, 2, 4, 7, 12, 20, 33, 54. N(h) + 1 is Fibonacci.</li>
<li>N(h) ≥ φʰ → <b>h ≤ 1.44 log₂ n</b>. Lower bound ⌊log₂ n⌋. 10⁹ keys → at most ~43 levels.</li>
<li>AVL vs red-black: AVL tighter (1.44 vs 2 log₂ n), better for read-heavy; red-black fewer rotations, better for write-heavy.</li>
</ul>`,

{
  id: 'l06', title: 'L06 2-3, red-black, B-trees', sub: 'split and promote, LLRB rules, B/B+ on disk',
  cram: `<ul>
<li>2-3: 2-nodes and 3-nodes, all leaves at one depth. Insert in a leaf; a 4-node splits, middle key moves up. Height grows only by a root split.</li>
<li>2-3 delete: remove in a leaf (swap with predecessor); underflow → borrow from a 3-node sibling, else merge with the parent key.</li>
<li>LLRB: root black, red links lean left, no node with two red links, perfect black balance. New node red.</li>
<li>fixUp: right red &amp; left black → rotateLeft; left red &amp; left.left red → rotateRight; both red → flipColors (= split).</li>
<li>RB height ≤ 2 log₂ n. 1..1023 → 1013 rotations, 1013 flips.</li>
<li>B-tree order M: ≤ M − 1 keys, non-root ≥ ⌈M/2⌉ children. M = 1000 → 10⁹ keys in 3 reads. B+: values in linked leaves, range scans.</li>

  lesson: `
<h3>2-3 trees</h3>
<ul>
<li>2-node: 1 key, 2 children. 3-node: 2 keys, 3 children (&lt; a, between, &gt; c). Perfect balance: every leaf at the same depth.</li>
<li>Height: log₃(n+1) − 1 ≤ h ≤ log₂(n+1) − 1.</li>
<li><b>Insert:</b> search to a leaf, add the key. 2-node → 3-node, done. 3-node → temporary 4-node → <b>split</b>: middle key moves up, two 2-nodes remain. Can cascade to the root; a root split makes a new root (the only way height grows).</li>
</ul>
<pre>50, 30, 70, 10, 20:
[50] → [30|50] → [30|50|70] splits → [50] over [30] [70]
10 → [10|30]; 20 → [10|20|30] splits, 20 up → root [20|50] over [10] [30] [70]</pre>
<ul>
<li>Insert 65 into [40] over [20|30], [60|70]: [60|65|70] splits, 65 up → [40|65] over [20|30] [60] [70].</li>
<li><b>Delete:</b> always from a leaf (internal key → swap with in-order predecessor). Empty node: <b>borrow</b> through the parent from a 3-node sibling, otherwise <b>merge</b> with the parent's key. An emptied root disappears (height shrinks).</li>
</ul>
<h3>Left-leaning red-black (LLRB)</h3>
<ul>
<li>A 2-3 tree stored as a BST: a 3-node = two nodes joined by a <b>red</b> link leaning left.</li>
<li>Rules: (1) root black, (2) red links lean left, (3) no node has two red links, (4) every root-to-null path has the same number of black links.</li>
<li>Insert: plain BST insert, new node <b>red</b> (a black leaf would break black balance on every insert).</li>
</ul>
<pre>fixUp(h):
if (isRed(h-&gt;right) &amp;&amp; !isRed(h-&gt;left))      h = rotateLeft(h);
if (isRed(h-&gt;left) &amp;&amp; isRed(h-&gt;left-&gt;left))  h = rotateRight(h);
if (isRed(h-&gt;left) &amp;&amp; isRed(h-&gt;right))       flipColors(h);
root-&gt;red = false;</pre>
<ul>
<li>flipColors = a 2-3 split: children turn black, h turns red (joins its parent).</li>
<li>10, 20, 30 → one rotateLeft, one flip: 20 black over 10, 30 black.</li>
<li>Height ≤ 2 log₂ n (black height = 2-3 height; reds at most alternate). Sorted 1..1023: 1013 rotations, 1013 flips.</li>
<li>Used in std::map, Java TreeMap. ≤ 2 rotations per insert, ≤ 3 per delete.</li>
</ul>
<h3>B-trees and B+ trees</h3>
<ul>
<li>Order M: ≤ M children (M − 1 keys); non-root ≥ <b>⌈M/2⌉</b> children; root ≥ 2 children unless a leaf; all leaves same depth. 2-3 tree = order 3.</li>
<li>Cost = disk reads (block transfers). One node = one block. M = 1000: 10⁹ keys in 3 levels vs ~30 for a binary tree.</li>
<li>Insert: split at M keys, promote the middle.</li>
<li>Choose M to fill a block: 4096 B, 8-byte keys and pointers → 8M + 8(M − 1) ≤ 4096 → M = 256.</li>
<li><b>B+ tree:</b> internal nodes are routers (keys only, equal goes right), all records in leaves, leaves linked → range scans walk the chain. A leaf split copies a key up; a router split moves it.</li>
</ul>
<div class="tbl"><table>
<tr><th>Tree</th><th>Height</th><th>Best for</th></tr>
<tr><td>AVL</td><td>≤ 1.44 log₂ n</td><td>read-heavy in RAM</td></tr>
<tr><td>red-black</td><td>≤ 2 log₂ n</td><td>write-heavy, std lib</td></tr>
<tr><td>2-3</td><td>≤ log₂ n</td><td>explains red-black</td></tr>
<tr><td>B / B+</td><td>≈ log_M n</td><td>disk, databases</td></tr>
</table></div>`,

  id: 'l07', title: 'L07 Heaps and heapsort', sub: 'array layout, swim/sink, heapify Θ(n), heapsort',
  cram: `<ul>
<li>Max-heap: complete + every parent ≥ children. Array a[1..n]: parent k/2, children 2k, 2k + 1. Height ⌊log₂ n⌋.</li>
<li>insert: append, swim up. delMax: swap a[1] with a[n], n−−, sink down (swap with the LARGER child).</li>
<li>Heapify: sink k = n/2 down to 1. Θ(n). n inserts: Θ(n log n).</li>
<li>Leaves are a[n/2 + 1 .. n]; the min is some leaf.</li>
<li>Heapsort: heapify, then n − 1 × (swap max to end, sink). Θ(n log n), Θ(1) space, not stable.</li>
</ul>`,
  lesson: `
<h3>The structure</h3>
<ul>
<li>PQ options: unordered array (insert Θ(1), delMax Θ(n)), ordered (the reverse), <b>heap: both Θ(log n)</b>.</li>
<li>Binary max-heap = <b>complete</b> tree + <b>heap order</b> (parent ≥ children). Max at the root. Every subtree is a heap.</li>
<li>Stored 1-indexed in a[1..n]: <b>parent(k) = k/2, left = 2k, right = 2k + 1</b>. Children of 6 → 12, 13. Parent of 11 → 5.</li>
<li>Height ⌊log₂ n⌋ (n = 100 → 6). Internal nodes 1..n/2, leaves n/2 + 1..n. The min is at some leaf: Θ(n) to find.</li>
<li>Paths are sorted, levels are not.</li>
</ul>
<h3>swim and sink</h3>
<pre>insert: a[++n] = key; swim(n)       // while k &gt; 1 &amp;&amp; a[k/2] &lt; a[k]: swap, k /= 2
delMax: swap(a[1], a[n--]); sink(1) // swap with the LARGER child while smaller</pre>
<ul>
<li>Insert 85 into [90 80 70 30 60 50]: lands at a[7] under 70, beats 70, loses to 90 → [90 80 85 30 60 50 70].</li>
<li>Insert 95 into the same heap → [95 80 90 30 60 50 70].</li>
<li>delMax on [95 90 70 80 60 50]: 50 to the top, sinks past 90 then 80 → returns 95, heap [90 80 70 50 60].</li>
<li>delMax on [95 80 90 30 60 50 70] → returns 95, heap [90 80 70 30 60 50].</li>
</ul>
<h3>Heapify in Θ(n)</h3>
<pre>for (k = n/2; k &gt;= 1; k--) sink(a, k, n);</pre>
<ul>
<li>[30 60 50 90 85 40 70 45 20] → [90 85 70 60 30 40 50 45 20].</li>
<li>[10 20 30 40 50 60 70] → [70 50 60 40 20 10 30].</li>
<li>Sink costs height, and half the nodes are leaves with height 0: total swaps S = 2^(h+1) − h − 2 &lt; n. <b>Θ(n).</b></li>
<li>n inserts pay depth (swim): <b>Θ(n log n)</b>.</li>
<li>Θ(n) build doesn't beat the sorting bound: a heap is not sorted.</li>
</ul>
<h3>Heapsort</h3>
<pre>heapify(a, n);
for (end = n; end &gt; 1; end--) { swap(a[1], a[end]); sink(a, 1, end - 1); }</pre>
<ul>
<li>[95 90 70 80 60] → after round 1: [90 80 70 60 | 95], round 2: [80 60 70 | 90 95].</li>
<li>Θ(n log n) worst case, Θ(1) extra space, not stable. std::sort (introsort) falls back to it.</li>
<li>Mergesort Θ(n log n), Θ(n) space, stable. Quicksort worst Θ(n²).</li>
<li>Libraries: C++ priority_queue = max-heap; Java PriorityQueue, Python heapq = min-heap.</li>
</ul>`,

{
  id: 'l08', title: 'L08 Hashing', sub: 'hash functions, chaining, probing, deletion, resizing',
  cram: `<ul>
<li>Horner: h = (31h + c) mod M per char. CAT, M = 100 → 67, 42, 86. M prime.</li>
<li>Chaining: α = n/M = chain length. Miss ≈ α, hit ≈ 1 + α/2.</li>
<li>Linear probing: h, h+1, … mod M. Stop at EMPTY. Naive delete loses keys; use tombstones, re-insert the cluster, or shift with d(r, i) &lt; d(r, j).</li>
<li>Quadratic h + i²: secondary clustering. Double h + i·h₂ (h₂ ≠ 0): ~none.</li>
<li>Ideal miss 1/(1 − α); linear ½(1 + 1/(1 − α)²). Keep α ≤ ~0.5 linear, ~1 chaining.</li>
<li>Resize: double M, rehash all. Θ(1) expected / amortized, Θ(n) worst. No order ops.</li>
</ul>`,
  lesson: `
<h3>Hash functions</h3>
<ul>
<li>h(k) → [0, M). Θ(1) expected, Θ(n) worst. Gives up order: no min, max, floor, range.</li>
<li>Collisions are unavoidable (pigeonhole). Birthday bound: 50% at n ≈ 1.18√M (M = 365 → 23).</li>
<li>Good hash: deterministic, uniform, quick, uses the whole key.</li>
<li>k mod M with <b>M prime</b>. M = 2ᵖ keeps only the low p bits (multiples of 8 into M = 64 use 1/8 of slots).</li>
<li>Horner: <code>h = (31·h + c) % M</code>. hash("CAT"), M = 100: 67 → 42 → 86.</li>
</ul>
<h3>Separate chaining</h3>
<ul>
<li>α = n/M = expected chain length. Miss ≈ α compares, hit ≈ 1 + α/2. At α = 1, ~37% of buckets empty.</li>
<li>Delete = unlink. α can pass 1.</li>
</ul>
<h3>Linear probing</h3>
<ul>
<li>Probe h, h+1, … mod M to the first EMPTY. Invariant: no hole between h(k) and k.</li>
<li>M = 11, insert 22, 33, 44, 1 → [22 33 44 1 _ …]; search 12 (home 1) = 4 probes, miss.</li>
<li>Delete: naive emptying breaks searches. <b>Tombstone</b> (search passes, insert reuses). <b>Re-insert</b> the rest of the cluster until EMPTY (Θ(L²)). <b>Shift</b>: key in slot j with home r moves to hole i iff (i − r) mod M &lt; (j − r) mod M (Θ(L)).</li>
<li>M = 11 [11 53 _ … _ 31 42], delete 31 → [11 _ … _ 42 53].</li>
</ul>
<h3>Better probes</h3>
<ul>
<li>Primary clustering (linear). Quadratic (h + i²) leaves secondary clustering; needs M prime, α &lt; ½.</li>
<li>Double hashing (h + i·h₂(k)) mod M, h₂ = 7 − (k mod 7), never 0. M = 11: 89 → 1, 18 → 7, 40 → 9, 29 → 2.</li>
<li>Miss cost: ideal 1/(1 − α) (α = ½ → 2, ¾ → 4); linear ½(1 + 1/(1 − α)²) (½ → 2.5, ¾ → 8.5).</li>
<li>α ceilings: chaining ~1, double ~0.7, linear ~0.5. Resize = double M and rehash (homes change). Amortized Θ(1).</li>
<li>std::map (RB tree, sorted, operator&lt;) vs unordered_map (hash, std::hash + ==).</li>
</ul>`,

  id: 'l09', title: 'L09 Graphs, BFS, DFS', sub: 'handshake, matrix vs list, traversal orders, BFS distances',
  cram: `<ul>
<li>Σ deg = 2E. Max E = V(V − 1)/2. Tree: connected, acyclic, V − 1 edges.</li>
<li>List Θ(V + E) space, O(deg) neighbors. Matrix Θ(V²), O(1) edge query.</li>
<li>DFS: stack/recursion. BFS: queue, mark on enqueue, dist = fewest edges. Both Θ(V + E).</li>
<li>Course DAG 0→1,3,5 · 1→2,3 · 2→3 · 3→4,7 · 4→5,7 · 5→6.</li>
<li>Recursive DFS 0 1 2 3 4 5 6 7 · iterative 0 5 6 3 7 4 1 2 · BFS 0 1 3 5 2 4 7 6.</li>
<li>Diamond: DFS 0 1 3 2, BFS 0 1 2 3.</li>
</ul>`,
  lesson: `
<h3>Vocabulary and counting</h3>
<ul>
<li>G = (V, E). Undirected or directed. Degree, path, cycle, connected.</li>
<li><b>Handshake:</b> Σ deg = 2E (digraph: Σ in = Σ out = E). Degrees 4, 3, 3, 2, 2 → E = 7. An even sum is necessary, not sufficient.</li>
<li>Simple undirected: E ≤ V(V − 1)/2. Sparse E = O(V), dense Θ(V²).</li>
<li>Tree: connected + acyclic + V − 1 edges (any two imply the third). The directed diamond is a DAG, not a tree.</li>
</ul>
<h3>Representations</h3>
<div class="tbl"><table>
<tr><th></th><th>Matrix</th><th>List</th></tr>
<tr><td>space</td><td>Θ(V²)</td><td>Θ(V + E)</td></tr>
<tr><td>edge query</td><td>O(1)</td><td>O(deg u)</td></tr>
<tr><td>neighbors</td><td>O(V)</td><td>O(deg u)</td></tr>
</table></div>
<p>V = 10,000, average degree 6: E = 30,000, list = 70,000 slots, matrix = 10⁸ cells.</p>
<h3>DFS</h3>
<ul>
<li>Mark, recurse into each unseen neighbor. One call visits exactly the reachable set. Restart loop over all vertices; restarts = components (undirected).</li>
<li>Cost Σ(1 + deg v) = V + 2E = Θ(V + E). On a matrix Θ(V²).</li>
<li>Iterative (explicit stack) pops lists reversed. Deep recursion can overflow the call stack.</li>
</ul>
<h3>BFS</h3>
<ul>
<li>Queue; <b>mark on enqueue</b> (else a vertex can enter twice); dist[v] = dist[u] + 1.</li>
<li>The queue holds at most two distances, d and d + 1. dist = fewest edges.</li>
<li>DFS memory O(longest path), BFS O(widest layer).</li>
<li>Grid maze = implicit graph, 4 neighbors, Θ(rows·cols).</li>
<li>Same loop: stack → DFS, queue → BFS, PQ by cost → Dijkstra, PQ by estimate → A*.</li>
</ul>
<div class="tbl"><table>
<tr><th>Graph</th><th>DFS rec</th><th>DFS iter</th><th>BFS</th></tr>
<tr><td>diamond 0→1,2; 1→3; 2→3</td><td>0 1 3 2</td><td>0 2 3 1</td><td>0 1 2 3</td></tr>
<tr><td>course DAG</td><td>0 1 2 3 4 5 6 7</td><td>0 5 6 3 7 4 1 2</td><td>0 1 3 5 2 4 7 6</td></tr>
</table></div>
<p>Course DAG BFS from 0: layers {0}, {1, 3, 5}, {2, 4, 6, 7}. From 1: dist[6] = 4.</p>`,

function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

function renderHome() {
  setTab('study'); quiz = null;
  const done = TOPICS.filter(t => passed[t.id]).length;
  let h = '<div class="card"><div class="progress"><div class="qhead"><h2>Topics</h2><span class="chip ' + (done === TOPICS.length ? 'good' : 'idle') + '">' + done + ' of ' + TOPICS.length + ' passed</span></div>' +
    '<div class="bar"><i style="width:' + (100 * done / TOPICS.length) + '%"></i></div>' +
    '<p class="meta">Each topic: read the lesson, then answer one question at a time. A miss goes back into the queue until you get it right.</p></div>' +
    '<div class="topics">';
  TOPICS.forEach((t, i) => {
    const st = passed[t.id] ? '<span class="chip good">Passed</span>' : '<span class="chip idle">' + t.qs.length + ' Qs</span>';
    h += '<button class="topic" type="button" data-t="' + i + '"><span class="num">' + String(i + 1).padStart(2, '0') + '</span><span><span class="t">' + t.title + '</span><br><span class="s">' + t.sub + '</span></span>' + st + '</button>';
  });
  h += '</div>';
  if (done) h += '<button type="button" id="reset">Reset progress</button>';
  h += '</div>';
  view.innerHTML = h;
  view.querySelectorAll('.topic').forEach(b => b.onclick = () => renderLesson(+b.dataset.t));

  document.getElementById('back').onclick = renderHome;
  document.getElementById('go').onclick = () => startQuiz(i);
  window.scrollTo(0, 0);
}

function startQuiz(i) {
  const t = TOPICS[i];
  quiz = { i, t, queue: shuffle(t.qs.map((_, k) => k)), cleared: 0, total: t.qs.length, misses: 0, attempts: 0 };
  renderQ();
}

function renderQ() {
  const { t, i } = quiz;
  if (!quiz.queue.length) return renderDone();
  const qi = quiz.queue[0], q = t.qs[qi];
  const order = shuffle(q.o.map((_, k) => k));
  const letters = 'ABCD';
  let h = '<div class="card"><div class="qhead"><span class="chip">' + t.title + '</span><span class="chip ' + (quiz.misses ? 'warn' : 'idle') + '">' + quiz.cleared + ' of ' + quiz.total + ' cleared</span></div>' +
    '<div class="bar"><i style="width:' + (100 * quiz.cleared / quiz.total) + '%"></i></div>' +
    '<p class="qtext">' + esc(q.q) + '</p><div class="opts">';
  order.forEach((k, pos) => { h += '<button class="opt" type="button" data-k="' + k + '"><span class="k">' + letters[pos] + '</span><span>' + esc(q.o[k]) + '</span></button>'; });
  h += '</div><div id="fb"></div><div class="row"><button type="button" id="lesson">Back to lesson</button></div></div>';
  view.innerHTML = h;
  document.getElementById('lesson').onclick = () => renderLesson(i);
  view.querySelectorAll('.opt').forEach(b => b.onclick = () => answer(+b.dataset.k, q));
}

function answer(k, q) {
  const ok = k === q.a;
  quiz.attempts++;
  view.querySelectorAll('.opt').forEach(b => {
    b.disabled = true;
    const bk = +b.dataset.k;
    if (bk === q.a) b.classList.add('right');
    else if (bk === k) b.classList.add('wrong');
  });
  const cur = quiz.queue.shift();
  if (ok) quiz.cleared++; else { quiz.misses++; quiz.queue.push(cur); }
  const fb = document.getElementById('fb');
  fb.innerHTML = '<div class="explain ' + (ok ? 'ok' : 'no') + '"><b>' + (ok ? 'Correct.' : 'Not quite. This one comes back later.') + '</b><span>' + esc(q.e) + '</span></div>' +
    '<div class="row" style="margin-top:10px"><button type="button" class="primary" id="next">' + (quiz.queue.length ? 'Next question' : 'Finish topic') + '</button></div>';
  const n = document.getElementById('next'); n.onclick = renderQ; n.focus();
}

function renderDone() {
  const { t, i } = quiz;
  passed[t.id] = true; save();
  const first = quiz.total - Math.min(quiz.misses, quiz.total);
  const next = TOPICS.findIndex((x, j) => j > i && !passed[x.id]);
  const anyLeft = TOPICS.findIndex(x => !passed[x.id]);
  const target = next >= 0 ? next : anyLeft;
  let h = '<div class="card"><span class="chip good">Topic passed</span><h2>' + t.title + '</h2>' +
    '<p>You cleared all ' + quiz.total + ' questions in ' + quiz.attempts + ' attempts' + (quiz.misses ? ' (' + quiz.misses + ' miss' + (quiz.misses > 1 ? 'es' : '') + ' requeued).' : ', no misses.') + '</p>' +
    '<div class="row"><button type="button" id="home">All topics</button>';
  if (target >= 0) h += '<button type="button" class="primary" id="nxt">Next: ' + TOPICS[target].title + '</button>';
  else h += '<button type="button" class="primary" id="cram">Open the cheat sheet</button>';
  h += '</div></div>';
  view.innerHTML = h;
  document.getElementById('home').onclick = renderHome;
  if (target >= 0) document.getElementById('nxt').onclick = () => renderLesson(target);
  else document.getElementById('cram').onclick = renderCram;
  window.scrollTo(0, 0);
}

function renderCram() {
  setTab('cram'); quiz = null;
  view.innerHTML = '<div class="cram">' + CRAM + '</div>';
  if (location.hash !== '#cram') history.replaceState(null, '', '#cram');
  window.scrollTo(0, 0);
}

document.getElementById('mode-full').onclick = () => setMode('full');
document.getElementById('mode-quick').onclick = () => setMode('quick');
tabStudy.onclick = renderHome;
tabCram.onclick = renderCram;
window.addEventListener('hashchange', () => { if (location.hash === '#cram') renderCram(); });
let initialMode = 'full';
try { if (localStorage.getItem('css343mode') === 'quick') initialMode = 'quick'; } catch(e) {}
setMode(initialMode);
if (location.hash === '#cram') renderCram();
</script>
</body>
